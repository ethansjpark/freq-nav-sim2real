agent: "ppo"
num_steps: 500000
batch_size: 64
lr: 3e-4
gamma: 0.99
use_ddppo: false
gae_lambda: 0.95
rollout_steps: 256
ppo_epochs: 4
clip_coef: 0.2
value_coef: 0.5
entropy_coef: 0.01
max_grad_norm: 0.5
checkpoint_interval: 10000
log_interval: 5
image_size: 224
max_episode_steps: 500

frequency_adapt:
  enabled: false
  radius: 16
  noise_std: 1.0

